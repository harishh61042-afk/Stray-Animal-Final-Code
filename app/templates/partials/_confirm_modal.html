{# Shared confirmation dialog. Triggered by any form/button with data-confirm="Question?" (see app.js). #}
<div class="modal fade" id="pcConfirmModal" tabindex="-1" aria-labelledby="pcConfirmTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-sm-down">
    <div class="modal-content pc-modal">
      <div class="modal-body text-center p-4">
        <div class="pc-modal-icon"><i class="bi bi-question-lg"></i></div>
        <h5 class="fw-semibold mb-2" id="pcConfirmTitle">Please confirm</h5>
        <p class="text-body-secondary mb-4" id="pcConfirmMessage">Are you sure?</p>
        <div class="d-flex gap-2 justify-content-center">
          <button type="button" class="btn btn-light px-4" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary px-4" id="pcConfirmOk">Yes, continue</button>
        </div>
      </div>
    </div>
  </div>
</div>
